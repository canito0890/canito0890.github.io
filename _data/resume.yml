# Résumé: single source of truth.
#
# This one file feeds all four résumé surfaces:
#   /resume/                        themed page on the site
#   assets/files/joel-cano-resume.pdf   public PDF (no email)
#   tmp/joel-cano-resume-private.pdf    private PDF (with email)
#   tmp/Joel-Cano-Resume.docx           editable doc for Google Docs / Word
#
# Edit here, then run `bin/build-resume` to regenerate the PDF and .docx.
#
# PRIVACY: no email or phone in this file — it is public in the repo. Those live
# in tmp/resume.private.yml (gitignored) and are merged only into the private
# PDF and the .docx. See README.md.
#
# Dates are display strings, not YAML dates, so "Present" needs no special case
# and nothing has to be reformatted downstream.

