# Pins the Ruby used in this repo. `.ruby-version` alone is not enough: mise
# only reads idiomatic version files for tools listed in
# `idiomatic_version_file_enable_tools`, which does not include ruby by default,
# so without this file `bundle exec jekyll` falls back to the system Ruby (2.6)
# and cannot find the bundled gems. Keep the version in sync with .ruby-version.
[tools]
ruby = "3.4.1"
